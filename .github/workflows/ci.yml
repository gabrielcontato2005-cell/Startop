name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/startop_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Banco de teste (stub do Supabase + migrations)
        run: npm run db:teste
      - name: Dados de exemplo carregam sem erro
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into auth.users (email) values ('ci@startop.test')"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/demo.sql
          npm run db:teste
      - name: Testes (regras e banco)
        run: npm test
      - name: Build
        run: npm run build
